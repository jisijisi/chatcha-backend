<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ChatCDO</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/admin-login.css">

</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">🔐</div>
      <h1>Admin Portal</h1>
      <p>ChatCDO Management System</p>
    </div>
    
    <form class="login-form" id="adminLoginForm" autocomplete="off">
      <div class="error-message" id="errorMessage"></div>
      
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="adminEmail" placeholder="admin@cdo.com.ph" required autocomplete="off">
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="adminPassword" placeholder="Enter your password" required autocomplete="off">
          <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
        </div>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn">
        Sign In
      </button>
      
      <div class="footer-link">
        <a href="index.html">← Back to Main App</a>
      </div>
    </form>
  </div>

  <script type="module" src="assets/js/admin-login.js"></script>
</body>
</html>
